<text x="900" y="120" font-size="15" class="t2">NOTES  (all dims caliper-measured 2026-08-20 unless noted)</text>
<text x="900" y="142" font-size="13" class="t2">1. Lip 19.66 sq x 4.10 incl. the 1.2 PCB -> plastic lip 2.90.</text>
<text x="900" y="164" font-size="13" class="t2">    Housing alone 7.16 tall; assembled with PCB 8.36.</text>
<text x="900" y="186" font-size="13" class="t2">2. Top tier 18.52 sq, corners R2.0. Walls 1.4 -> cavity 16.86 sq.</text>
<text x="900" y="208" font-size="13" class="t2">3. Top plate 2.0 thick: O15.7 counterbore 1.0 deep from the TOP face,</text>
<text x="900" y="230" font-size="13" class="t2">    O13.5 window through -> 1.1 wide x 1.0 thick shoulder. The sensor</text>
<text x="900" y="252" font-size="13" class="t2">    is fitted from OUTSIDE and bears DOWN on that shoulder, so finger</text>
<text x="900" y="274" font-size="13" class="t2">    pressure cannot push it into the enclosure. Max bezel here is O16.</text>
<text x="900" y="296" font-size="13" class="t2">4. Rear shelf 11.0 x 1.18 out x 1.36 thick, top at z=2.62, hollow under,</text>
<text x="900" y="318" font-size="13" class="t2">    gusset each end - slides under the metal case as a pivot.</text>
<text x="900" y="340" font-size="13" class="t2">5. Arm 5.12 wide x 2.94 thick; tip->opposite corner 30.14; hole O2.0</text>
<text x="900" y="362" font-size="13" class="t2">    at 13.84 from centre, csk O4.4. Screw down here last.</text>
<text x="900" y="384" font-size="13" class="t2">6. PCB 19.60 x 17.60 x 1.20, FLUSH WITH THE FRONT - the 2.06 shortfall</text>
<text x="900" y="406" font-size="13" class="t2">    is all at the rear, under the shelf. Screws at (+-8.30, 0).</text>
<text x="900" y="428" font-size="13" class="t2">7. Pogo pads measured + fabbed: pitch 2.50, pad O2.20.</text>
